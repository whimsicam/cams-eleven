# Deploy su GitHub Pages: solo da `main`, solo quando cambia qualcosa che finisce nel sito.
# Il branch `data` (progressi) non passa mai di qui.
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "SPEC.md"
      - "README.md"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
